# An example of the blog on two web nodes behind a balancer, sharing one
# Redis, with the CMS, its PostgreSQL, and the news worker. Not a production
# setup: one Redis and one PostgreSQL, no TLS. See docs/deployment.md.
#
#   cp deploy/.env.example deploy/.env   # then fill in the secrets
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up --build
#
# The blog is then on http://localhost:8080, the CMS admin on http://localhost:3001/admin.
name: crypto-blog

x-web: &web
  build: { context: .., target: web }
  restart: unless-stopped
  depends_on:
    redis: { condition: service_healthy }
  environment: &web-env
    BACKEND_API_URL: ${BACKEND_API_URL:?the exchange backend, e.g. http://host.docker.internal:8080/api/v1}
    PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:8080}
    DEPLOYMENT_REGION: ${DEPLOYMENT_REGION:-ir}
    CMS_API_URL: http://cms:3001/api
    REVALIDATE_SECRET: ${REVALIDATE_SECRET:?32+ characters, shared with the CMS}
    CACHE_REDIS_URL: redis://redis:6379/0
    # The balancer sets X-Forwarded-For and X-Forwarded-Proto.
    TRUST_PROXY_HEADERS: "true"
    SHUTDOWN_DRAIN_SECONDS: "10"
  stop_grace_period: 20s

services:
  web-1:
    <<: *web
  web-2:
    <<: *web

  balancer:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [web-1, web-2]
    ports: ["8080:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # A cache: no persistence, and the least recently used keys go first.
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "512mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?a password for the CMS and news databases}
      POSTGRES_DB: cms
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "blog"]
      interval: 5s
      retries: 10

  cms-migrate:
    build: { context: .., target: cms-migrate }
    depends_on:
      postgres: { condition: service_healthy }
    environment: &cms-env
      DATABASE_URL: postgres://blog:${POSTGRES_PASSWORD}@postgres:5432/cms
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?32+ random characters}
      CMS_PUBLIC_URL: http://localhost:3001
      # Any node revalidates every node: the cache is shared.
      WEB_REVALIDATE_URLS: http://balancer/api/revalidate
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      WEB_PREVIEW_URL: ${PUBLIC_SITE_URL:-http://localhost:8080}

  cms:
    build: { context: .., target: cms }
    restart: unless-stopped
    depends_on:
      cms-migrate: { condition: service_completed_successfully }
    ports: ["3001:3001"]
    environment: *cms-env

  news-migrate:
    build: { context: .., target: news-worker }
    command: ["node", "--import", "tsx", "src/migrate.ts"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://blog:${POSTGRES_PASSWORD}@postgres:5432/news

  news-worker:
    build: { context: .., target: news-worker }
    restart: unless-stopped
    depends_on:
      news-migrate: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgres://blog:${POSTGRES_PASSWORD}@postgres:5432/news
      DEPLOYMENT_REGION: ${DEPLOYMENT_REGION:-ir}
      BACKEND_API_URL: ${BACKEND_API_URL}
      # Both, or neither (the worker then only collects): http://cms:3001/api and the newsbot's key.
      CMS_API_URL: ${NEWS_CMS_API_URL:-}
      CMS_API_KEY: ${NEWS_CMS_API_KEY:-}
      BLOG_PUBLIC_URL: ${PUBLIC_SITE_URL:-http://localhost:8080}

volumes:
  postgres:
