# A sketch of the web app on Kubernetes (docs/deployment.md): any number of
# replicas, one shared Redis (here a Sentinel group run elsewhere, e.g. the
# Bitnami chart), rolling updates that drain each pod first. Adapt the
# image, hosts, and secrets; the CMS and the news worker follow the same shape.
apiVersion: v1
kind: ConfigMap
metadata:
  name: blog-web
data:
  BACKEND_API_URL: http://exchange-backend.exchange.svc:8080/api/v1
  PUBLIC_SITE_URL: https://blog.example.com
  DEPLOYMENT_REGION: ir
  CMS_API_URL: http://blog-cms:3001/api
  CACHE_REDIS_SENTINELS: redis-node-0.redis-headless:26379,redis-node-1.redis-headless:26379,redis-node-2.redis-headless:26379
  CACHE_REDIS_MASTER: mymaster
  TRUST_PROXY_HEADERS: "true"
  SHUTDOWN_DRAIN_SECONDS: "15"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc:4318
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-web
spec:
  replicas: 3
  selector:
    matchLabels: { app: blog-web }
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: blog-web }
    spec:
      # Longer than SHUTDOWN_DRAIN_SECONDS: readiness turns 503 at SIGTERM,
      # the endpoints drop the pod, and requests in flight finish.
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: blog-web }
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: web
          image: registry.example.com/crypto-blog-web:1.0.0
          ports: [{ name: http, containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: blog-web }
            - secretRef: { name: blog-web } # REVALIDATE_SECRET, CMS_PREVIEW_API_KEY, CACHE_REDIS_PASSWORD
          readinessProbe:
            httpGet: { path: /api/health/ready, port: http }
            periodSeconds: 5
            failureThreshold: 1
          livenessProbe:
            httpGet: { path: /api/health/live, port: http }
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            # Next.js writes image optimizer output under .next/cache.
            - { name: next-cache, mountPath: /app/apps/web/.next/cache }
      volumes:
        - name: next-cache
          emptyDir: { sizeLimit: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: blog-web
spec:
  selector: { app: blog-web }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: blog-web
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: blog-web }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: blog-web
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: blog-web }
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
