# The balancer of deploy/docker-compose.yml: round robin over the web
# nodes, a rate limit per client address, and the forwarded headers the
# nodes trust (TRUST_PROXY_HEADERS=true). In production the edge (CDN or
# the cloud balancer) usually does this; the limits are the same.

# 20 requests a second per address, bursts of 40; the webhook and health
# checks are not limited.
limit_req_zone $binary_remote_addr zone=pages:20m rate=20r/s;
limit_req_status 429;

upstream web {
  server web-1:3000 max_fails=2 fail_timeout=5s;
  server web-2:3000 max_fails=2 fail_timeout=5s;
  keepalive 32;
}

server {
  listen 80;
  server_tokens off;
  client_max_body_size 64k;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_id;
  # A node that is draining or down: try the other one.
  proxy_next_upstream error timeout http_502 http_503;

  location /api/health/ {
    proxy_pass http://web;
  }

  location = /api/revalidate {
    # Only the CMS calls it; the signature is checked by the node.
    proxy_pass http://web;
  }

  location / {
    limit_req zone=pages burst=40 nodelay;
    proxy_pass http://web;
  }
}
